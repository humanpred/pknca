# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}
          # The minimum R version declared in DESCRIPTION.  The hard
          # dependencies are installed with the suggested packages that the
          # tests use.  The current Matrix and MASS need R 4.4, and pak installs
          # only the newest release of a dependency, so their last releases
          # that support R 4.1 are pinned for lme4 and lmerTest.  ggtibble
          # (R >= 4.3) is used only by a vignette, so R CMD check runs with
          # _R_CHECK_FORCE_SUGGESTS_ off and without the vignettes.
          - {os: ubuntu-latest,   r: '4.1',
             deps: '"hard"',
             extra: 'any::rcmdcheck, any::testthat, any::units, any::emmeans, any::lme4, any::lmerTest, cran::Matrix@1.6-5, cran::MASS@7.3-60.0.1, humanpred/cdiscdata',
             force-suggests: 'false',
             check-args: 'c("--no-manual", "--as-cran", "--ignore-vignettes")',
             build-args: 'c("--no-manual", "--no-build-vignettes")'}
          # The minimum R version of the current Matrix (needed by lme4)
          - {os: ubuntu-latest,   r: '4.4'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: ${{ matrix.config.force-suggests || 'true' }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: ${{ matrix.config.deps || '"all"' }}
          extra-packages: ${{ matrix.config.extra || 'any::rcmdcheck, humanpred/cdiscdata' }}
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: ${{ matrix.config.check-args || 'c("--no-manual", "--as-cran")' }}
          build_args: ${{ matrix.config.build-args || 'c("--no-manual","--compact-vignettes=gs+qpdf")' }}
