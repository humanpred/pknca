# Checks the oldest R version that DESCRIPTION claims to support.
#
# This is separate from R-CMD-check.yaml so that file stays close to the
# r-lib/actions template and remains easy to update from upstream.  It needs
# its own dependency handling: ggtibble requires R >= 4.3 and so cannot be
# installed here, and pak fails the whole resolution if any suggested package
# is unavailable.  Hard dependencies are therefore installed from DESCRIPTION
# and the suggested packages are listed explicitly, minus ggtibble.  The one
# vignette chunk that uses ggtibble is conditional on it being available.
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check-min-r.yaml

permissions: read-all

jobs:
  R-CMD-check-min-r:
    runs-on: ubuntu-latest
    name: ubuntu-latest (oldest supported R)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.1'
          http-user-agent: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          # Suggests from DESCRIPTION, minus ggtibble (needs R >= 4.3).  Keep
          # in sync when DESCRIPTION's Suggests change.
          extra-packages: |
            any::rcmdcheck
            any::covr
            any::cowplot
            any::emmeans
            any::ggplot2
            any::knitr
            any::labeling
            any::lme4
            any::lmerTest
            any::pander
            any::rmarkdown
            any::spelling
            any::testthat
            any::units
            any::withr

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
