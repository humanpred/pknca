<?xml version='1.0' encoding='UTF-8' ?>
<svg xmlns='http://www.w3.org/2000/svg' width='840' height='520' viewBox='0 0 840 520' font-family='sans-serif' font-size='13'>
<title>Decision tree for choosing between automatic curve stripping, exclude_half.life, and include_half.life</title>
<desc>Automatic curve stripping is the default and requires neither column.  Setting exclude_half.life drops the points flagged TRUE and then curve strips the remainder.  Setting include_half.life keeps only the points flagged TRUE and fits them directly.  In every case, below the limit of quantification and zero concentrations and points at or before the end of the last dose are dropped before fitting.</desc>
<defs>
  <marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'>
    <path d='M 0 0 L 10 5 L 0 10 z' fill='#000000' />
  </marker>
</defs>
<g fill='none' stroke='#000000' stroke-width='1.5'>
  <rect x='45' y='15' width='750' height='45' rx='6' fill='#ffffff' />
  <line x1='420' y1='60' x2='420' y2='92' />
  <line x1='140' y1='92' x2='700' y2='92' />
  <line x1='140' y1='92' x2='140' y2='118' marker-end='url(#arrow)' />
  <line x1='420' y1='92' x2='420' y2='118' marker-end='url(#arrow)' />
  <line x1='700' y1='92' x2='700' y2='118' marker-end='url(#arrow)' />

  <rect x='15' y='120' width='250' height='60' rx='6' fill='#ffffff' />
  <rect x='295' y='120' width='250' height='60' rx='6' fill='#ffffff' />
  <rect x='575' y='120' width='250' height='60' rx='6' fill='#ffffff' />

  <line x1='140' y1='180' x2='140' y2='213' marker-end='url(#arrow)' />
  <line x1='420' y1='180' x2='420' y2='213' marker-end='url(#arrow)' />
  <line x1='700' y1='180' x2='700' y2='213' marker-end='url(#arrow)' />

  <rect x='15' y='215' width='250' height='60' rx='6' fill='#ffffff' />
  <rect x='295' y='215' width='250' height='60' rx='6' fill='#ffffff' />
  <rect x='575' y='215' width='250' height='60' rx='6' fill='#ffffff' />

  <line x1='140' y1='275' x2='140' y2='308' marker-end='url(#arrow)' />
  <line x1='420' y1='275' x2='420' y2='308' marker-end='url(#arrow)' />
  <line x1='700' y1='275' x2='700' y2='308' marker-end='url(#arrow)' />

  <rect x='15' y='310' width='810' height='70' rx='6' fill='#f2f2f2' />

  <line x1='140' y1='380' x2='140' y2='403' marker-end='url(#arrow)' />
  <line x1='420' y1='380' x2='420' y2='403' marker-end='url(#arrow)' />
  <line x1='700' y1='380' x2='700' y2='403' marker-end='url(#arrow)' />

  <rect x='15' y='405' width='530' height='100' rx='6' fill='#ffffff' />
  <rect x='575' y='405' width='250' height='100' rx='6' fill='#ffffff' />
</g>
<g fill='#000000' stroke='none' text-anchor='middle'>
  <text x='420' y='43' font-size='15' font-weight='bold'>How should the points for the half-life fit be chosen?</text>

  <text x='140' y='145'><tspan x='140'>Let PKNCA choose them</tspan><tspan x='140' dy='18'>(the default)</tspan></text>
  <text x='420' y='145'><tspan x='420'>Curve strip, but drop</tspan><tspan x='420' dy='18'>specific known-bad points</tspan></text>
  <text x='700' y='145'><tspan x='700'>Use exactly the points I</tspan><tspan x='700' dy='18'>name, with no curve stripping</tspan></text>

  <text x='140' y='240'><tspan x='140'>Set neither column</tspan><tspan x='140' dy='18'>on PKNCAconc()</tspan></text>
  <text x='420' y='240'><tspan x='420' font-family='monospace'>exclude_half.life</tspan><tspan x='420' dy='18'>TRUE drops that point</tspan></text>
  <text x='700' y='240'><tspan x='700' font-family='monospace'>include_half.life</tspan><tspan x='700' dy='18'>TRUE keeps that point</tspan></text>

  <text x='420' y='333' font-weight='bold'>In every case, before any line is fit:</text>
  <text x='420' y='353'><tspan x='420'>drop BLQ and zero concentrations, and drop points at or before the end of the</tspan><tspan x='420' dy='18'>last dose (including infusion duration)</tspan></text>

  <text x='280' y='430' font-weight='bold'>Automatic point selection</text>
  <text x='280' y='455'><tspan x='280'>Every allowed set of points is fit and the best is kept, using</tspan><tspan x='280' dy='21' font-family='monospace'>min.hl.points, allow.tmax.in.half.life, adj.r.squared.factor</tspan></text>

  <text x='700' y='430' font-weight='bold'>Manual point selection</text>
  <text x='700' y='455'><tspan x='700'>One fit through exactly those</tspan><tspan x='700' dy='18'>points.  The three options at</tspan><tspan x='700' dy='18'>left are ignored.</tspan></text>
</g>
</svg>
